        <h1>tom gray</h1>
        <p>This preview is a 3D view. Without JavaScript, the projects are listed here.</p>
        <article>
          <h2>smart blinds</h2>
          <p>Blinds that read the light and decide for themselves.</p>
          <p>
            The blinds shipped with an official app that drops its connection and loses track of which
            blind is which. This is the same hardware driven from a web page instead: scan, connect,
            send any blind to any position, and have it remember them next time.
          </p>
          <a href="https://github.com/tom-gray-builds/smart-blinds">see the work</a>
        </article>
        <article>
          <h2>fontloop</h2>
          <p>A brief in plain English; a real typeface out.</p>
          <p>
            Drawing a display face means committing a few hundred curves by hand before you find out
            whether the idea was any good. This turns a written brief into a style descriptor and
            renders the whole family from it, so an idea can be judged in seconds instead of weeks —
            and then compiled to a font you can actually install.
          </p>
        </article>
        <article>
          <h2>avatars</h2>
          <p>One file defines a character; everything else is generated.</p>
          <p>
            An end-to-end test of how much of a consistent synthetic identity can be automated. A
            single definition holds a character's look, voice and world, and everything downstream —
            the images, the writing, the posting schedule — is derived from that one file rather than
            authored per post.
          </p>
        </article>
      </main>
    </noscript>
