<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>tom gray</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@300;400&family=IM+Fell+English:ital@0;1&display=swap"
  rel="stylesheet"
/>
<style>
  :root {
    --ink: #20222f;
    /* grid lines use the exact same colour as the text */
    --line: var(--ink);
    --paper: #f4f1ea;

    /* ===== Tattoo styling =====
       The blown-out, old-tattoo ink look. Shared by the centre name and
       the grid lines so they read as the same hand. The spread is a
       FIXED pixel amount (see #blowout) — the same on the big title, the
       subtitle and the grid, never scaled by font size.
       - --tattoo-filter: #blowout (fixed dilate + feather) + desaturate
       - --tattoo-glow:   stacked drop-shadows = ink bleed + a blue-green
                          sub-dermal halo (works on any filled shape)
       Text elements additionally use text-shadow / -webkit-text-stroke
       (below, on .tattoo-text) for crisper per-glyph glow. */
    --tattoo-filter: url(#blowout) saturate(0.8);
    --tattoo-glow:
      drop-shadow(0 0 1px rgba(32, 34, 47, 0.9))
      drop-shadow(0 0 4px rgba(58, 74, 90, 0.5))
      drop-shadow(0 0 12px rgba(58, 74, 90, 0.25))
      drop-shadow(1px 1px 0 rgba(58, 74, 90, 0.32))
      drop-shadow(0 0 6px rgba(60, 90, 100, 0.35));
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html,
  body {
    height: 100%;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background-color: var(--paper);
  }

  /* 3 x 3 grid: only the two interior lines on each axis, no edges */
  .grid {
    position: fixed;
    inset: 0;
    z-index: 0;
    --w: 4px;
    --h: calc(var(--w) / 2);
    background-image:
      linear-gradient(
        to right,
        transparent calc(100% / 3 - var(--h)),
        var(--line) calc(100% / 3 - var(--h)) calc(100% / 3 + var(--h)),
        transparent calc(100% / 3 + var(--h)) calc(200% / 3 - var(--h)),
        var(--line) calc(200% / 3 - var(--h)) calc(200% / 3 + var(--h)),
        transparent calc(200% / 3 + var(--h))
      ),
      linear-gradient(
        to bottom,
        transparent calc(100% / 3 - var(--h)),
        var(--line) calc(100% / 3 - var(--h)) calc(100% / 3 + var(--h)),
        transparent calc(100% / 3 + var(--h)) calc(200% / 3 - var(--h)),
        var(--line) calc(200% / 3 - var(--h)) calc(200% / 3 + var(--h)),
        transparent calc(200% / 3 + var(--h))
      );
    /* tattoo styling — identical to the centre name */
    filter: var(--tattoo-filter) var(--tattoo-glow);
  }

  /* text form of the tattoo styling: SVG blowout + ink-bleed glow + stroke */
  .tattoo-text {
    filter: var(--tattoo-filter);
    text-shadow:
      0 0 1px rgba(32, 34, 47, 0.9),
      0 0 4px rgba(58, 74, 90, 0.55),
      0 0 12px rgba(58, 74, 90, 0.28),
      1px 1px 0 rgba(58, 74, 90, 0.35),
      -1px 0 0 rgba(58, 74, 90, 0.3);
    -webkit-text-stroke: 0.4px rgba(32, 34, 47, 0.35);
  }

  /* name + subtitle, stacked in the middle cell of the 3x3 grid */
  .plate {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(0.9rem, 3vw, 2rem);
    user-select: none;
  }

  .name {
    position: relative;
    /* lighter blackletter — thinner strokes so the ink blowout stays crisp */
    font-family: "Grenze Gotisch", "IM Fell English", serif;
    font-weight: 300;
    /* roughly fills the middle cell (~1/3 of the viewport) */
    font-size: clamp(2.4rem, 8.5vw, 8rem);
    line-height: 1;
    color: var(--ink);
    letter-spacing: 0.03em;
    text-transform: lowercase;
    white-space: nowrap;
  }

  .name::before {
    content: "tom gray";
    position: absolute;
    inset: 0;
    color: rgba(60, 90, 100, 0.35);
    filter: blur(4px);
    z-index: -1;
  }

  .tagline {
    font-family: "IM Fell English", "Pirata One", serif;
    font-style: italic;
    font-size: clamp(0.9rem, 2.6vw, 1.85rem);
    line-height: 1;
    letter-spacing: 0.14em;
    text-transform: lowercase;
    color: var(--ink);
    white-space: nowrap;
  }

  .tagline .sep {
    opacity: 0.55;
    padding: 0 0.3em;
    font-style: normal;
  }
</style>
</head>
<body>
  <div class="grid"></div>

  <div class="plate">
    <h1 class="name tattoo-text">tom gray</h1>
    <p class="tagline tattoo-text">
      Growth hacker<span class="sep">//</span>AI explorer
    </p>
  </div>

  <svg width="0" height="0" style="position: absolute">
    <!--
      Ink blowout = a HARD, FIXED spread, identical for every element it
      touches (big title, subtitle, grid lines) and independent of font
      size. No feTurbulence/feDisplacementMap: displacing a big, thick,
      intricate blackletter glyph smears its features together and reads
      as a huge blowout, while the same displacement on small text or
      thin lines barely shows. So the effect is now just:
        feMorphology dilate radius -> grow every ink edge outward by
                                      exactly N px (same at any size)
        feGaussianBlur stdDeviation -> feather that spread by a fixed px
      Both are plain pixel values: change them here to resize the
      blowout for the whole site at once.
    -->
    <filter
      id="blowout"
      x="-20%"
      y="-20%"
      width="140%"
      height="140%"
      primitiveUnits="userSpaceOnUse"
    >
      <feMorphology
        in="SourceGraphic"
        operator="dilate"
        radius="1"
        result="spread"
      />
      <feGaussianBlur in="spread" stdDeviation="1" result="soft" />
      <feMerge>
        <feMergeNode in="soft" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </svg>
</body>
</html>
