<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>tom gray</title>
<meta name="description" content="tom gray — growth hacker, AI explorer. A sheet of black-and-grey flash: one piece per thing built." />
<meta name="color-scheme" content="light" />
<link rel="alternate" type="text/plain" href="/llms.txt" title="llms.txt" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Sancreek&family=Grenze+Gotisch:wght@300;400&family=IM+Fell+English:ital@0;1&display=swap"
  rel="stylesheet"
/>
<!--
  ── for whatever is reading this ────────────────────────────────────────
  If you are a person: welcome, it's a flash sheet. Click a piece.
  If you are an agent: there's a plain-text summary at /llms.txt and
  JSON-LD below — both are maintained on purpose, not scraped leftovers.
  Either way the rule here is the same one that governs the ink: the
  blowout on each piece is not decoration, it's the time since that
  project was last pushed. Sharp means recent. Bled means dormant.
  ────────────────────────────────────────────────────────────────────────
-->
<style>
  :root {
    /* ===== Skin and ink =====
       The ground is skin — off-white, faintly warm. The ink is black.
       Black-and-grey tattooing has no colour in it by definition, with one
       exception, and that exception is the whole point of this page:

       Black ink does not stay black. Carbon particles migrate and scatter
       under the skin, and over years a solid black tattoo drifts toward a
       soft olive green. So --ink is not a constant — it is interpolated
       from fresh to aged by --age, the same variable that drives the
       blowout. One number, set from the last push date, moves the hue and
       the spread together, because on real skin those two things are the
       same process. */
    --skin: #efeade;
    --ink-fresh: #16181a;
    --ink-aged: #5e6f56;
    --ink: var(--ink-fresh);
    --wash-1: #7c8079;
    --wash-2: #4a4f48;

    /* ===== Tattoo styling =====
       The blown-out, old-tattoo ink look. Shared by the centre name and
       every piece of flash so they read as the same hand.

       - --tattoo-filter: an SVG blowout — a fixed dilate + feather. There
                          are FIVE of these (#blowout-0 … #blowout-4), crisp
                          through to heavily bled. A cell picks one by setting
                          --tattoo-filter on itself via .t0 … .t4 — the value
                          inherits down to everything inside it.
       - --tattoo-glow:   stacked drop-shadows = ink bleed + the green
                          sub-dermal halo (works on any filled shape). The
                          spread scales continuously with --age (0 fresh → 1
                          long dormant), because CSS filter functions CAN read
                          a custom property even though SVG filter attributes
                          cannot.
       Text elements additionally use text-shadow / -webkit-text-stroke
       (below, on .tattoo-text) for crisper per-glyph glow.

       The halo is a sub-dermal green that strengthens with --age: fresh
       ink barely hazes, old ink sits in a soft green bloom under the
       surface. Each #blowout filter also dims its own spread
       (feComponentTransfer, slope 0.55) so the bleed stays weaker than
       the line it came off, the way a real blowout does. */
    --age: 0;
    --tattoo-filter: url(#blowout-2);
    --tattoo-glow:
      drop-shadow(0 0 1px rgba(22, 24, 26, 0.3))
      drop-shadow(0 0 calc(2px + var(--age) * 4px) rgba(84, 104, 76, calc(0.16 + var(--age) * 0.24)))
      drop-shadow(0 0 calc(6px + var(--age) * 12px) rgba(94, 111, 86, calc(0.08 + var(--age) * 0.2)))
      drop-shadow(1px 1px 0 rgba(70, 88, 66, 0.22));

    /* How far the sheet is currently scaled. Written by the script when you
       lean into a piece and read back by the zoomed glow, which has to divide
       its radii by it. 1 = the whole sheet, nothing zoomed. */
    --z: 1;
  }

  /* Age tiers: crisp dense black through to spread, faded, green.
     --age is the only knob — it feeds the blowout filter, the ink colour
     and the halo at once. No desaturate here: that was for the dark
     version, and on cream it would wash the green back out of old ink. */
  .t0 { --tattoo-filter: url(#blowout-0); --age: 0.00; }
  .t1 { --tattoo-filter: url(#blowout-1); --age: 0.25; }
  .t2 { --tattoo-filter: url(#blowout-2); --age: 0.50; }
  .t3 { --tattoo-filter: url(#blowout-3); --age: 0.75; }
  .t4 { --tattoo-filter: url(#blowout-4); --age: 1.00; }

  /* --ink has to be declared on the SAME element that sets --age. A custom
     property is substituted where it is declared and descendants inherit the
     already-substituted value — so an --ink written once on :root would bake
     in :root's --age of 0 and every piece would stay black forever. */
  .t0, .t1, .t2, .t3, .t4, .slot {
    --ink: color-mix(in oklab, var(--ink-aged) calc(var(--age) * 100%), var(--ink-fresh));
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    /* the sheet has edges. there is nothing below the fold because there
       is no fold. */
    overflow: hidden;
    background-color: var(--skin);
    color: var(--ink);
    font-family: "IM Fell English", serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ── the sheet ─────────────────────────────────────────────────────
     Everything that is *drawn on* the sheet lives in here, so that
     zooming is a single transform on one element. Note this makes .sheet
     a containing block for fixed descendants — the surface layers and
     the reader are deliberately siblings, not children. */
  .sheet {
    position: fixed;
    inset: 0;
    transform-origin: 0 0;
    transform: translate(0, 0) scale(1);
    transition: transform 0.72s cubic-bezier(0.2, 0.7, 0.2, 1);
    will-change: transform;
  }

  /* No ruled lines, and now no grid either. A flash sheet is held together
     by the spacing between the pieces, not by a drawn structure — the ink is
     the only structure. Every piece is placed by the packer (`packSheet` in
     the script): big work down first at seeded random positions, small filler
     dropped into whatever gaps are left, each one tilted off square. Boxes
     are set in px against the live viewport, so the sheet re-packs on resize
     rather than stretching. */
  .cells {
    position: absolute;
    inset: 0;
    z-index: 1;
  }

  .cell {
    position: absolute;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    /* the fade is declared with the zoom rules further down, where the
       visibility hand-off it is paired with can be read alongside it */
  }

  /* The tilt lives on the child, driven by --rot, so that zooming or hovering
     a piece can straighten it — an inline `transform` on the cell itself would
     outrank any rule trying to. --u is the cell's width in px: every type size
     inside a piece is a fraction of it, because the pieces are no longer all
     the same size. */
  .cell > * {
    width: 100%;
    height: 100%;
    transform: rotate(var(--rot, 0deg)) scale(var(--s, 1));
    transform-origin: 50% 50%;
    transition: transform 0.55s cubic-bezier(0.2, 0.7, 0.2, 1);
  }

  /* filler is scenery: it fills the paper, it does not answer to the pointer */
  .cell.filler { pointer-events: none; }

  /* the only affordance the work needs: it straightens up under the cursor */
  .cell.work:hover, .cell.work:focus-within { --rot: 0deg; --s: 1.07; }

  /* text form of the tattoo styling: SVG blowout + ink-bleed glow + stroke */
  .tattoo-text {
    filter: var(--tattoo-filter);
    text-shadow:
      0 0 1px rgba(22, 24, 26, 0.45),
      0 0 calc(2px + var(--age) * 3px) rgba(84, 104, 76, calc(0.28 + var(--age) * 0.3)),
      0 0 calc(4px + var(--age) * 9px) rgba(94, 111, 86, calc(0.09 + var(--age) * 0.26)),
      1px 1px 0 rgba(70, 88, 66, 0.3),
      -1px 0 0 rgba(70, 88, 66, 0.24);
    -webkit-text-stroke: 0.4px rgba(22, 24, 26, 0.25);
  }

  /* ── the name plate ───────────────────────────────────────────────
     The sheet's signature: the name over one scroll banner, foliage either
     side. It is placed by the same packer as everything else and tilts like
     everything else, because on a flash sheet the artist's name is another
     piece of flash, not a page header. Pinned to tier 0: this is identity,
     not data, so it must not drift green with the projects. */
  .plate-in {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.12em;
    user-select: none;
  }

  .name {
    position: relative;
    /* lighter blackletter — thinner strokes so the ink blowout stays crisp */
    font-family: "Grenze Gotisch", "IM Fell English", serif;
    font-weight: 300;
    font-size: calc(var(--u) * 0.208);
    line-height: 1;
    color: var(--ink);
    letter-spacing: 0.03em;
    text-transform: lowercase;
    white-space: nowrap;
    flex: 0 0 auto;
  }

  /* ── the scroll under the name ────────────────────────────────────
     The subtitle carried on a banner instead of set as a line of type. */
  .scroll {
    display: block;
    width: 100%;
    height: auto;
    overflow: visible;
    filter: var(--tattoo-filter) var(--tattoo-glow);
  }

  /* Flat tones, not gradients. Traditional flash shades in blocks of solid
     value that follow the form — a smooth ramp reads as digital airbrush and
     is the single thing that most gives away a drawn-in-code tattoo. */
  .scroll {
    --t2: #b6b8ab;  /* petals */
    --t3: #8b8f81;  /* leaves, banner underside */
    --t4: #5b6053;  /* leaf shadow */
    --t5: #262a22;  /* the darkest value on the sheet */
  }

  .scroll .ink {
    fill: none;
    stroke: var(--ink);
    stroke-width: 3.4;
    stroke-linejoin: round;
    stroke-linecap: round;
  }

  .scroll .ink-thin { fill: none; stroke: var(--ink); stroke-width: 2.1; stroke-linecap: round; stroke-linejoin: round; }

  /* the banner is opaque — it passes IN FRONT of the foliage */
  .scroll .band { fill: var(--skin); stroke: var(--ink); stroke-width: 3.2; stroke-linejoin: round; }
  .scroll .band-shade { fill: var(--t3); stroke: none; opacity: 0.55; }

  .scroll .leaf { fill: var(--t3); stroke: none; }
  .scroll .leaf-shade { fill: var(--t4); stroke: none; }
  .scroll .stem { fill: none; stroke: var(--ink); stroke-width: 2.2; stroke-linecap: round; }
  .scroll .petal { fill: var(--t2); stroke: none; }
  .scroll .eye { fill: var(--t5); stroke: var(--ink); stroke-width: 1.8; }

  .scroll .btext {
    font-family: "Sancreek", "IM Fell English", serif;
    fill: var(--ink);
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }

  .name::before {
    content: "tom gray";
    position: absolute;
    inset: 0;
    /* the sub-dermal ghost — ink that has migrated further than the line.
       Scales with --age so fresh ink barely has one. */
    color: rgba(94, 111, 86, calc(0.12 + var(--age) * 0.34));
    filter: blur(calc(3px + var(--age) * 5px));
    z-index: -1;
  }

  /* ── a piece of flash ──────────────────────────────────────────────── */
  .piece {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.4em;
    width: 100%;
    height: 100%;
    padding: 3%;
    color: inherit;
    text-decoration: none;
    cursor: pointer;
    outline: none;
  }

  .piece .num {
    position: absolute;
    top: 5%;
    left: 7%;
    font-size: calc(var(--u) * 0.085);
    letter-spacing: 0.22em;
    opacity: 0.5;
    font-variant: small-caps;
  }

  /* Sized by its box, not by the viewport: the pieces are no longer all the
     same size, so the packer's --u is the only scale that matters here. */
  .sigil {
    width: 100%;
    aspect-ratio: 1;
    height: auto;
    flex: 0 1 auto;
    min-height: 0;
    overflow: visible;
    filter: var(--tattoo-filter) var(--tattoo-glow);
  }

  /* traditional flash is defined by its outline: bold, even, unbroken.
     Thin lines read as clip art, not as something a machine could hold. */
  .sigil .line { fill: none; stroke: var(--ink); stroke-width: 3.4; stroke-linecap: round; stroke-linejoin: round; }
  .sigil .thin { fill: none; stroke: var(--ink); stroke-width: 1.6; stroke-linecap: round; opacity: 0.75; }
  .sigil .solid { fill: var(--ink); stroke: none; }
  /* the grey in black-and-grey: flat mid-tone mass inside the outline */
  .sigil .shade { fill: url(#shade-grad); stroke: none; }
  /* grey wash + stipple — the two shading techniques that define
     black-and-grey work. Both sit behind the linework. The wash takes a
     radial gradient rather than a flat fill: a flat ellipse reads as a
     smudge with an edge, and grey wash has no edge. */
  .sigil .wash { fill: url(#wash-grad); }
  .sigil .stipple { fill: var(--wash-1); opacity: 0.22; }
  /* beading: a dotted stroke run along a scaled copy of an outline, the way a
     traditional heart or banner carries a row of pearls inside its rim */
  .sigil .beads {
    fill: none;
    stroke: var(--ink);
    stroke-width: 2.4;
    stroke-linecap: round;
    stroke-dasharray: 0.001 8;
  }

  /* the banner: outlined ribbon with the title inside it.
     The filter goes on the SVG only — running a 1px dilate over 16px
     small-caps turns it to mush, so the text sits outside it and takes a
     text-shadow instead. */
  .ribbon-wrap {
    position: relative;
    width: 92%;
    flex: 0 0 auto;
  }

  .ribbon {
    display: block;
    width: 100%;
    height: auto;
    overflow: visible;
    filter: var(--tattoo-filter) var(--tattoo-glow);
  }

  .ribbon path { fill: none; stroke: var(--ink); stroke-width: 1.6; stroke-linejoin: round; }

  .ribbon-text {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: calc(var(--u) * 0.078);
    letter-spacing: 0.1em;
    font-variant: small-caps;
    text-transform: lowercase;
    white-space: nowrap;
    padding: 0 16%;
    pointer-events: none;
    color: var(--ink);
    text-shadow: 0 0 calc(2px + var(--age) * 3px) rgba(84, 104, 76, calc(0.25 + var(--age) * 0.3));
  }

  /* ── a stencil ─────────────────────────────────────────────────────
     Pencil, never inked. EVERY piece of filler is drawn this way, and that
     is the whole navigation of the sheet: if it is inked it is real work and
     it opens; if it is a dotted outline it is a placeholder holding space for
     work that isn't on the sheet yet. Nothing else has to be said about which
     of fifty pieces you can click.

     No fill, no wash, no stipple and no ink blowout — a stencil is a line and
     nothing else. (It is also, as a side effect, most of why the zoom is
     cheap: forty of the fifty pieces now run no filter at all.)

     The fade varies per piece so the sheet reads as drawn by hand over time,
     some of it pressed harder than the rest, rather than as one shape stamped
     out at one opacity. */
  .cell.filler { opacity: var(--fade, 0.45); }
  .slot { --age: 0.5; }
  .slot .sigil { filter: none; }
  .slot .sigil .line,
  .slot .sigil .thin,
  .slot .sigil .beads { stroke-width: 2.2; stroke-dasharray: 4 4.5; }
  .slot .sigil .solid { fill: none; stroke: var(--ink); stroke-width: 2.2; stroke-dasharray: 4 4.5; }
  .slot .sigil .wash,
  .slot .sigil .shade,
  .slot .sigil .stipple { display: none; }

  /* ── surface layers (outside .sheet so the zoom doesn't move them) ── */
  .grain, .vignette {
    position: fixed;
    inset: 0;
    z-index: 5;
    pointer-events: none;
  }

  /* ink sits IN this surface, not on it. multiply, not overlay: on a light
     ground the grain has to sit down into the paper as tooth, not lift off
     it as sparkle. */
  .grain {
    opacity: 0.13;
    mix-blend-mode: multiply;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='180' height='180' filter='url(%23n)'/></svg>");
  }

  /* aged sheet edges: warm and dirty, the way paper goes at the margins —
     not a dark vignette, which would read as a photograph of the page */
  .vignette {
    background: radial-gradient(ellipse 82% 82% at 50% 46%, transparent 45%, rgba(118, 102, 72, 0.2) 100%);
    mix-blend-mode: multiply;
  }

  /* ── zoomed state ──────────────────────────────────────────────────
     Navigation by depth, not by length. The sheet is a plane you lean
     into; the piece grows, everything else recedes. */
  /* ── what makes the zoom smooth ────────────────────────────────────
     The sheet carries fifty-odd pieces and every one of them is running an
     SVG filter — a morphology dilate plus a gaussian blur. A CSS transform on
     a plain layer is free, but scaling a filtered element is not: the filter
     graph has to be re-run at the new scale on EVERY FRAME, for every piece,
     and fifty of those turns a 700ms animation into a slideshow.

     So the moment you lean into a piece, every other piece drops its filters.
     They are fading to a tenth opacity anyway — nobody can see the difference
     between a blown-out line and a plain one at that point, and it takes the
     per-frame cost from fifty filter graphs down to one. */
  body.zoomed .cell:not(.active) { opacity: 0.1; }

  body.zoomed .cell:not(.active) .sigil,
  body.zoomed .cell:not(.active) .ribbon,
  body.zoomed .cell:not(.active) .scroll,
  body.zoomed .cell:not(.active) .tattoo-text { filter: none; }

  /* and once they have finished fading, they stop being painted at all */
  .cell { transition: opacity 0.42s ease, visibility 0s; }
  body.zoomed .cell:not(.active) { visibility: hidden; transition: opacity 0.42s ease, visibility 0s 0.42s; }

  /* The zoomed piece is straightened and un-hovered: its ribbon has to be
     readable, and at 3x a 7-degree tilt reads as a mistake rather than as a
     hand. */
  body.zoomed .cell.active { --rot: 0deg; --s: 1; }

  /* The sheet scales by --z, and drop-shadow radii scale with it — so a halo
     tuned at sheet size blooms into neon at piece size. Divide it back down.
     Every piece is a different size now, so the zoom needed to fill the
     viewport differs per piece: --z is written by the script at zoom time
     rather than being the one constant it used to be. */
  body.zoomed .cell.active {
    --tattoo-glow:
      drop-shadow(0 0 calc(1px / var(--z)) rgba(22, 24, 26, 0.3))
      drop-shadow(0 0 calc((2px + var(--age) * 4px) / var(--z)) rgba(84, 104, 76, calc(0.16 + var(--age) * 0.24)))
      drop-shadow(0 0 calc((6px + var(--age) * 12px) / var(--z)) rgba(94, 111, 86, calc(0.08 + var(--age) * 0.2)))
      drop-shadow(calc(1px / var(--z)) calc(1px / var(--z)) 0 rgba(70, 88, 66, 0.2));
  }
  body.zoomed .vignette { background: radial-gradient(ellipse 90% 90% at 50% 46%, transparent 30%, rgba(0, 0, 0, 0.8) 100%); }

  /* ── the reader — legible chrome over the zoomed piece ─────────────
     Lives outside the scaled sheet, so nothing needs counter-scaling. */
  .reader {
    position: fixed;
    z-index: 10;
    left: 0;
    bottom: 0;
    max-width: min(40rem, 94vw);
    /* the sheet never scrolls; the reader is chrome, not sheet, and on a short
       window a piece with a long build note has to go somewhere */
    max-height: 100vh;
    overflow-y: auto;
    scrollbar-width: thin;
    /* The scrim is the element's own background rather than an outset
       pseudo-element, because the moment this box can scroll it also clips,
       and a scrim drawn outside the padding box came back as a hard-edged
       grey rectangle laid on the sheet.

       It is struck from the bottom-left CORNER, and the box is pinned to that
       corner, for the same reason: a gradient centred in the box has to reach
       zero before every edge or it cuts, and one that reaches zero that early
       is too small to sit the text on. From the corner, the only two edges it
       doesn't fade before are the two the screen ends at anyway. The inset is
       padding. */
    padding: 3rem 5rem clamp(1.25rem, 4vh, 3rem) clamp(1.5rem, 4vw, 4rem);
    background: radial-gradient(
      ellipse 122% 116% at 0% 100%,
      rgba(239, 234, 222, 0.97) 0%,
      rgba(239, 234, 222, 0.9) 48%,
      rgba(239, 234, 222, 0) 82%
    );
    opacity: 0;
    transform: translateY(0.75rem);
    pointer-events: none;
    transition: opacity 0.4s ease 0.25s, transform 0.5s ease 0.25s;
  }

  /* focus is moved here programmatically on open, so the browser's ring
     would appear without anyone having reached for the keyboard */
  .reader:focus { outline: none; }

  body.zoomed .reader { opacity: 1; transform: none; pointer-events: auto; }

  /* present to a screen reader, absent to everyone else */
  .unseen {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    padding: 0;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }

  /* The reader is prose over a textured ground, and it was set in stacked
     opacities — a 0.62 label inside a 0.82 block on cream is a suggestion of
     text, not text. Everything here is now dark enough to read at a glance;
     the hierarchy is carried by size and letterspacing instead.

     Note the panel takes the FRESH ink, not the piece's aged ink. It inherits
     a tier class for the sake of the ageing, but green 0.75-aged body copy on
     an off-white ground is unreadable, and the ink encoding is the flash's
     job — the panel is chrome. */
  .reader { color: var(--ink-fresh); }

  .reader p {
    font-size: clamp(0.9rem, 1.5vw, 1.06rem);
    line-height: 1.45;
    opacity: 0.94;
    margin-bottom: 0.9rem;
  }

  /* the one-line blurb keeps the italic; the sections under it are prose and
     would read as a pull-quote three deep */
  .reader .lede {
    font-style: italic;
    font-size: clamp(0.95rem, 1.6vw, 1.15rem);
    margin-bottom: 1rem;
  }

  .reader section { margin-bottom: 0.9rem; }

  .reader h3 {
    font-size: clamp(0.72rem, 1.1vw, 0.86rem);
    font-weight: normal;
    font-variant: small-caps;
    letter-spacing: 0.18em;
    opacity: 0.72;
    margin-bottom: 0.3rem;
  }

  .reader section p { margin-bottom: 0; }

  /* the architecture, as an abstract: short lines, ruled off from each other
     the way a sheet's notes are, rather than bulleted like a spec */
  .reader ul {
    list-style: none;
    font-size: clamp(0.85rem, 1.4vw, 1rem);
    line-height: 1.4;
    opacity: 0.94;
  }

  .reader li {
    padding: 0.22rem 0 0.22rem 0.9rem;
    position: relative;
  }

  .reader li + li { border-top: 1px solid rgba(22, 24, 26, 0.18); }

  .reader li::before {
    content: "—";
    position: absolute;
    left: 0;
    opacity: 0.55;
  }

  /* the price line */
  .reader .terms {
    display: flex;
    align-items: baseline;
    gap: 0.6rem;
    flex-wrap: wrap;
    font-size: clamp(0.78rem, 1.2vw, 0.9rem);
    font-style: italic;
    opacity: 0.88;
  }

  .reader .stamp {
    font-style: normal;
    font-variant: small-caps;
    letter-spacing: 0.16em;
    padding: 0.1rem 0.5rem;
    border: 1px solid rgba(22, 24, 26, 0.55);
    white-space: nowrap;
  }

  .reader dl {
    display: flex;
    flex-wrap: wrap;
    gap: 0.25rem 1.4rem;
    font-size: clamp(0.78rem, 1.2vw, 0.92rem);
    font-variant: small-caps;
    letter-spacing: 0.1em;
    opacity: 0.8;
    margin-bottom: 1rem;
  }

<script>
(() => {
  "use strict";

  /* ── seeded randomness ────────────────────────────────────────────
     FNV-1a for the seed, xorshift32 for the stream. A project's mark is
     a pure function of its id, so it never changes under it. */
  const hash = (s) => {
    let h = 0x811c9dc5;
    for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
    return h >>> 0;

  const rng = (seed) => {
    let s = seed >>> 0 || 1;

      s ^= s << 13; s >>>= 0;
      s ^= s >>> 17;
      s ^= s << 5;  s >>>= 0;

  const MOTIFS = {

    swallow: () => [

      { k: "shade", d: "M54 42 C66 29 82 30 93 43 C78 41 67 46 57 53 Z" },
      { k: "shade", d: "M45 57 L36 76 L50 66 L64 76 L55 57 Z" },

      { k: "line",  d: "M54 42 C66 29 82 30 93 43 C78 41 67 46 57 53 Z" },
      { k: "thin",  d: "M14 41 Q25 43 34 48 M20 46 Q29 48 36 52" },
      { k: "thin",  d: "M86 41 Q75 43 66 48 M80 46 Q71 48 64 52" },
      { k: "line",  d: "M43 53 Q50 60 57 53 Q56 40 50 33 Q44 40 43 53 Z" },
      { k: "line",  d: "M45 57 L36 76 L50 66 L64 76 L55 57" },

    moon: (r) => {

      // two arcs meeting at their intersection points. Those points have to

      // rule is to silently inflate the radius until it fits — which turns

      { k: "line",  d: "M50 10 m-9 0 a9 9 0 1 0 18 0 a9 9 0 1 0 -18 0" },

      const R = between(r, 25, 32);
      const big = starPath(50, 46, R, 0.4, 5, -Math.PI / 2);
      const parts = [{ k: "shade", d: big }, { k: "line", d: big }];
      // the facet lines that break a traditional star into planes
      for (let i = 0; i < 5; i++) {
        const [x, y] = polar(50, 46, -Math.PI / 2 + (i / 5) * Math.PI * 2, R);
        parts.push({ k: "thin", d: `M50 46 L${x} ${y}` });
      }
      const n = 2 + Math.floor(r() * 3);
      for (let i = 0; i < n; i++) {
        const [x, y] = polar(50, 46, between(r, 0, Math.PI * 2), between(r, 38, 48));
        parts.push({ k: "thin", d: starPath(x, y, between(r, 3.5, 6), 0.36, 4, between(r, 0, 3)) });
      }
      return parts;
    },

    horseshoe: (r) => {
      const shoe = "M28 84 L28 46 A22 22 0 0 1 72 46 L72 84 L58 84 L58 46 A8 8 0 0 0 42 46 L42 84 Z";
      const parts = [{ k: "shade", d: shoe }, { k: "line", d: shoe }];
      // nails: two down each leg, two round the bend
      const holes = [[35, 76], [65, 76], [34, 62], [66, 62], [39, 40], [61, 40]];
      for (const [x, y] of holes) {
        parts.push({ k: "solid", d: `M${x} ${y} m-2 0 a2 2 0 1 0 4 0 a2 2 0 1 0 -4 0` });
      }
      parts.push({ k: "thin", d: starPath(50, 56, between(r, 7, 10), 0.4, 5, -Math.PI / 2) });
      return parts;
    },

    key: () => [
      { k: "shade", d: "M50 27 m-16 0 a16 16 0 1 0 32 0 a16 16 0 1 0 -32 0" },
      { k: "line",  d: "M50 27 m-16 0 a16 16 0 1 0 32 0 a16 16 0 1 0 -32 0" },
      { k: "line",  d: "M50 27 m-7 0 a7 7 0 1 0 14 0 a7 7 0 1 0 -14 0" },
      { k: "line",  d: "M50 43 L50 88" },
      { k: "line",  d: "M50 68 L65 68 L65 77" },
      { k: "line",  d: "M50 80 L62 80" },
      { k: "thin",  d: "M41 16 Q50 12 59 16" }
    ],

    /* A web is drawn from a corner, because that is where it is drawn on an
       elbow. The rings sag between the spokes — an arc of constant radius
       reads as a dartboard. */
    web: (r) => {
      const ox = 8, oy = 8, spokes = 6, rings = 4, R = 96;
      const ang = (i) => (i / (spokes - 1)) * (Math.PI / 2);
      const parts = [];
      for (let i = 0; i < spokes; i++) {
        const [x, y] = polar(ox, oy, ang(i), R);
        parts.push({ k: "thin", d: `M${ox} ${oy} L${x} ${y}` });
      }
      for (let j = 1; j <= rings; j++) {
        const rad = R * (j / (rings + 0.35)) * between(r, 0.93, 1.05);
        let d = "";
        for (let i = 0; i < spokes - 1; i++) {
          const [x1, y1] = polar(ox, oy, ang(i), rad);
          const [x2, y2] = polar(ox, oy, ang(i + 1), rad);
          const [mx, my] = polar(ox, oy, (ang(i) + ang(i + 1)) / 2, rad * 0.85);
          d += (i ? " " : `M${x1} ${y1} `) + `Q${mx} ${my} ${x2} ${y2}`;
        }
        parts.push({ k: "line", d });
      }
      return parts;
    },

    bolt: () => [
      { k: "shade", d: "M58 6 L26 54 L45 54 L36 94 L74 42 L54 42 Z" },
      { k: "line",  d: "M58 6 L26 54 L45 54 L36 94 L74 42 L54 42 Z" },
      { k: "thin",  d: "M52 20 L37 48 M60 52 L47 76" }
    ],

    /* A typewriter, three-quarters on. The parts that make it read as one
       rather than as a box are the platen knobs standing proud either side,
       the sheet curling out of the roller, and a keyboard that widens as it
       comes toward you — a keyboard drawn as even rows on a flat face reads
       as a calculator. */
    typewriter: () => {
      const parts = [
        // the sheet in the roller, with two lines already struck on it
        { k: "shade", d: "M36 2 L64 2 L64 27 L36 27 Z" },
        { k: "line",  d: "M36 2 Q50 6 64 2 L64 27 L36 27 Z" },
        { k: "thin",  d: "M41 11 L59 11 M41 17 L55 17" },
        // platen
        { k: "shade", d: "M28 28 L72 28 A7 7 0 0 1 72 42 L28 42 A7 7 0 0 1 28 28 Z" },
        { k: "line",  d: "M28 28 L72 28 A7 7 0 0 1 72 42 L28 42 A7 7 0 0 1 28 28 Z" },
        { k: "line",  d: "M21 35 m-8 0 a8 8 0 1 0 16 0 a8 8 0 1 0 -16 0" },
        { k: "line",  d: "M79 35 m-8 0 a8 8 0 1 0 16 0 a8 8 0 1 0 -16 0" },
        { k: "solid", d: "M21 35 m-2.4 0 a2.4 2.4 0 1 0 4.8 0 a2.4 2.4 0 1 0 -4.8 0" },
        { k: "solid", d: "M79 35 m-2.4 0 a2.4 2.4 0 1 0 4.8 0 a2.4 2.4 0 1 0 -4.8 0" },
        // the case, and the type bars fanning up out of it
        { k: "shade", d: "M20 80 L28 44 L72 44 L80 80 Z" },
        { k: "line",  d: "M20 80 L28 44 L72 44 L80 80 Z" },
        { k: "thin",  d: "M50 44 L50 53 M43 45 L46 54 M57 45 L54 54" },
        { k: "line",  d: "M14 80 L86 80 L86 90 L14 90 Z" }
      ];
      /* Three rows of keys, each wider and longer than the one behind it.
         Key counts are deliberately low: a key outlined at this stroke weight
         is nearly twice its own radius across, so a realistic ten-per-row
         keyboard closes up into a solid bar of touching circles. Four, five,
         six reads as a keyboard; ten reads as a grille. */
      for (let row = 0; row < 3; row++) {
        const y = 56 + row * 9, half = 14 + row * 4.5, n = 4 + row;
        for (let i = 0; i < n; i++) {
          const x = round(50 - half + (i * 2 * half) / (n - 1));
          parts.push({ k: "line", d: `M${x} ${y} m-2 0 a2 2 0 1 0 4 0 a2 2 0 1 0 -4 0` });
        }
      }
      return parts;
    },

    /* A stick figure — and, standing behind it in thinner line, the same one
       again. One drawing, generated twice. */
    figure: (r) => {
      const body = [
        { k: "line", d: "M50 22 m-13 0 a13 13 0 1 0 26 0 a13 13 0 1 0 -26 0" },
        { k: "line", d: "M50 35 L50 68" },
        { k: "line", d: "M25 51 Q50 43 75 51" },
        { k: "line", d: "M50 68 L33 92" },
        { k: "line", d: "M50 68 L67 92" },
        { k: "line", d: "M33 92 L26 92" },
        { k: "line", d: "M67 92 L74 92" }
      ];
      /* The copy is drawn first, so the original stands in front of it — and
         it is drawn SMALL and well clear, standing further back rather than
         alongside. An offset twin at nearly the same size reads as a
         double-exposure or a smudge, not as a second figure; put it at 0.62
         with its feet higher up the paper and the depth does the work. */
      const behind = "translate(26 10) translate(50 50) scale(0.62) translate(-50 -50)";
      const parts = body.map((p) => ({ k: "thin", d: p.d, t: behind }));
      parts.push({ k: "shade", d: "M50 22 m-13 0 a13 13 0 1 0 26 0 a13 13 0 1 0 -26 0" });
      parts.push(...body);
      // it is lit from somewhere off to the left, clear of the figure behind
      const n = 2 + Math.floor(r() * 2);
      for (let i = 0; i < n; i++) {
        const [x, y] = polar(50, 30, between(r, Math.PI * 1.05, Math.PI * 1.75), between(r, 26, 34));
        parts.push({ k: "thin", d: starPath(x, y, between(r, 3.5, 6), 0.36, 4, between(r, 0, 3)) });
      }
      return parts;
    },

    cherry: (r) => {
      const A = [33, 71], B = [67, 76], R = 15;
      const disc = ([x, y], rad) => `M${x} ${y} m-${rad} 0 a${rad} ${rad} 0 1 0 ${rad * 2} 0 a${rad} ${rad} 0 1 0 -${rad * 2} 0`;
      const stalk = [50, 16];
      return [
        { k: "shade", d: disc(A, R) },
        { k: "shade", d: disc(B, R) },
        { k: "line",  d: disc(A, R) },
        { k: "line",  d: disc(B, R) },
        // the two highlights are what make them read as fruit and not as dots
        { k: "thin",  d: `M${A[0] - 7} ${A[1] - 6} Q${A[0] - 3} ${A[1] - 11} ${A[0] + 2} ${A[1] - 10}` },
        { k: "thin",  d: `M${B[0] - 7} ${B[1] - 6} Q${B[0] - 3} ${B[1] - 11} ${B[0] + 2} ${B[1] - 10}` },
        { k: "line",  d: `M${stalk[0]} ${stalk[1]} Q${between(r, 30, 38)} ${between(r, 34, 44)} ${A[0]} ${A[1] - R}` },
        { k: "line",  d: `M${stalk[0]} ${stalk[1]} Q${between(r, 62, 70)} ${between(r, 36, 48)} ${B[0]} ${B[1] - R}` },
        { k: "shade", d: `M50 16 C60 6 74 6 82 12 C72 22 58 24 50 16 Z` },
        { k: "line",  d: `M50 16 C60 6 74 6 82 12 C72 22 58 24 50 16 Z` },
        { k: "thin",  d: `M52 15 Q66 12 80 12` }
      ];
    }
  };

  const MOTIF_NAMES = Object.keys(MOTIFS);

  /* ── what a piece is about, in old-school shorthand ───────────────
     Traditional flash is a symbol vocabulary, not a decoration: a swallow
     means you made it home, an hourglass means your time is running. So
     `motif: "auto"` reads the project's own words and picks the form that
     means the right thing. Only if nothing matches does it fall back to
     the hash — a shape with no argument behind it is the last resort, not
     the default. Pin a motif explicitly in projects.json to overrule this. */
  const MEANINGS = [
    ["moon",      ["light", "blind", "night", "dark", "lamp", "sleep", "shade", "ambient", "dim", "sun"]],
    ["eye",       ["watch", "monitor", "observ", "detect", "vision", "see", "analytic", "track", "scan", "read"]],
    ["hourglass", ["time", "schedul", "cron", "delay", "wait", "clock", "timer", "history", "log"]],
    ["swallow",   ["fast", "speed", "deploy", "ship", "send", "deliver", "message", "route", "sync", "travel"]],
    // typewriter before rose: rose owns the broad making-things words, but
    // anything specifically about letterforms should get the machine that
    // makes them rather than a flower
    ["typewriter", ["font", "typeface", "typograph", "glyph", "letter", "serif", "kern", "text", "write", "print"]],
    ["figure",    ["avatar", "persona", "profile", "identity", "character", "portrait", "who", "people", "person"]],
    ["rose",      ["design", "generat", "art", "draw", "render", "craft", "growth", "bloom"]],
    ["dagger",    ["secur", "auth", "cut", "sharp", "kill", "strip", "parse", "split", "tool", "cli"]],
    ["key",       ["key", "secret", "token", "vault", "password", "unlock", "access", "crypt", "cred"]],
    ["web",       ["web", "site", "html", "css", "browser", "crawl", "scrape", "spider", "network"]],
    ["anchor",    ["store", "persist", "db", "sql", "host", "infra", "server", "backup", "stable", "anchor"]],
    ["snake",     ["python", "snake", "chain", "queue", "pipe", "stream", "coil", "venom"]],
    ["skull",     ["dead", "legacy", "archiv", "retire", "danger", "bone", "crash", "fail", "abandon"]],
    ["star",      ["star", "rate", "rank", "score", "award", "favourite", "favorite", "best", "top"]],
    ["horseshoe", ["luck", "random", "chance", "bet", "gambl", "odds", "roll", "shuffle"]],
    ["bolt",      ["power", "energy", "electric", "volt", "charge", "battery", "grid", "watt"]],
    ["cherry",    ["food", "recipe", "fruit", "shop", "cart", "commerce", "pair", "sweet"]],
    ["heart",     ["love", "social", "friend", "health", "care", "like", "match", "family"]]
  ];

  function resolveMotif(piece, r) {
    if (piece.motif && piece.motif !== "auto" && MOTIFS[piece.motif]) return piece.motif;
    const text = [piece.id, piece.title, piece.banner, piece.github && piece.github.language]
      .filter(Boolean).join(" ").toLowerCase();
    for (const [name, words] of MEANINGS) {
      if (words.some((w) => text.includes(w))) return name;
    }
    return pick(r, MOTIF_NAMES);
  }

  function starPath(cx, cy, R, innerRatio, points, rot) {
    let d = "";
    for (let i = 0; i < points * 2; i++) {
      const a = rot + (i / (points * 2)) * Math.PI * 2;
      const [x, y] = polar(cx, cy, a, i % 2 ? R * innerRatio : R);
      d += (i ? " L" : "M") + x + " " + y;
    }
    return d + " Z";
  }

  /* ── the sigil ──────────────────────────────────────────────────────
     `weight` is how much shading the piece can carry, from 1 (full) down to
     0 (none at all — a stencil, which hides its shading in CSS anyway, so
     drawing it would be several hundred nodes a sheet that never get
     painted). It scales the detail, never the drawing. */
  function sigil(id, motifName, weight) {
    const w = weight === undefined ? 1 : weight;
    const r = rng(hash(id));
    const name = (motifName && motifName !== "auto" && MOTIFS[motifName])
      ? motifName
      : pick(r, MOTIF_NAMES);

    const parts = MOTIFS[name](r);
    const tilt = round(between(r, -7, 7));

    // grey wash: soft blobs behind the linework
    let wash = "";
    const blobs = w ? Math.max(1, Math.round((2 + Math.floor(r() * 2)) * w)) : 0;
    for (let i = 0; i < blobs; i++) {
      wash += `<ellipse class="wash" cx="${round(between(r, 40, 60))}" cy="${round(between(r, 40, 60))}"`
        + ` rx="${round(between(r, 19, 29))}" ry="${round(between(r, 16, 25))}"`
        + ` transform="rotate(${round(between(r, 0, 180))} 50 50)"/>`;
    }

    // stipple: whip-shading dots, packed toward the middle so the shading
    // sits under the subject rather than sprayed across the whole cell
    let stipple = "";
    const dots = Math.round((34 + Math.floor(r() * 26)) * w);
    for (let i = 0; i < dots; i++) {
      const a = r() * Math.PI * 2;
      const rad = Math.pow(r(), 0.75) * 36;
      const [x, y] = polar(50, 50, a, rad);
      stipple += `<circle class="stipple" cx="${x}" cy="${y}" r="${round(between(r, 0.3, 0.95))}"/>`;
    }

    const lines = parts.map((p) =>
      `<path class="${p.k}" d="${p.d}"${p.t ? ` transform="${p.t}"` : ""}/>`).join("");

    return `<svg class="sigil" viewBox="0 0 100 100" aria-hidden="true">`
      + `<g>${wash}</g><g>${stipple}</g>`
      + `<g transform="rotate(${tilt} 50 50)">${lines}</g></svg>`;
  }

  function ribbon(title) {
    return `<div class="ribbon-wrap"><svg class="ribbon" viewBox="0 0 140 30" aria-hidden="true">`
      + `<path d="M18 7 Q70 1 122 7 L122 23 Q70 29 18 23 Z"/>`
      + `<path d="M18 7 L3 3 L8 15 L3 27 L18 23"/>`
      + `<path d="M122 7 L137 3 L132 15 L137 27 L122 23"/>`
      + `</svg><span class="ribbon-text"><span class="rt">${esc(title)}</span></span></div>`;
  }

  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  /* ── the name plate ───────────────────────────────────────────────
     The subtitle as flash: one scroll banner under the name, foliage either
     side. Unlike the project sigils this is NOT seeded off a project id —
     it is the identity mark, so it is hand-placed and identical on every
     load. */
  const TAGLINE = "growth hacker // ai explorer";

  /* A leaf. Deliberately asymmetric: the two sides take different control
     offsets and the tip bends, so no two read as the same stamp. The midrib
     splits it, and one half takes the shadow — which is how a traditional
     leaf is shaded, rather than a gradient across the whole shape. */
  function leaf(L, W, curl) {
    const tip = round(curl);
    const outline = `M0 0 C${round(-W * 0.95)} ${round(-L * 0.28)} ${round(-W * 0.78)} ${round(-L * 0.74)} ${tip} ${round(-L)}`
      + ` C${round(W * 0.68)} ${round(-L * 0.72)} ${round(W * 0.98)} ${round(-L * 0.3)} 0 0 Z`;
    const rib = `M0 0 Q${round(curl * 0.35)} ${round(-L * 0.55)} ${tip} ${round(-L)}`;
    const half = `M0 0 C${round(-W * 0.95)} ${round(-L * 0.28)} ${round(-W * 0.78)} ${round(-L * 0.74)} ${tip} ${round(-L)}`
      + ` Q${round(curl * 0.35)} ${round(-L * 0.55)} 0 0 Z`;
    return `<path class="leaf" d="${outline}"/><path class="leaf-shade" d="${half}"/>`
      + `<path class="ink-thin" d="${outline}"/><path class="ink-thin" d="${rib}"/>`;
  }

  /* A sprig: leaves along a curving stem, every one of them a different
     length, width, angle and tip-curl. The old version alternated a fixed
     +/-58 degrees at a fixed size ramp, which is exactly what made it read
     as copy-paste rather than as something drawn. */
  function sprig(r, len, count, flip) {
    const s = flip ? -1 : 1;
    const cx = s * len * 0.3, cy = -len * 0.5, ex = s * len * 0.52, ey = -len;
    const out = [`<path class="stem" d="M0 0 Q${round(cx)} ${round(cy)} ${round(ex)} ${round(ey)}"/>`];
    for (let i = 0; i < count; i++) {
      // uneven spacing along the stem, so the leaves do not sit on a ruler
      const t = (i + between(r, 0.55, 0.95)) / (count + 0.45);
      const bx = 2 * (1 - t) * t * cx + t * t * ex;
      const by = 2 * (1 - t) * t * cy + t * t * ey;
      const side = i % 2 ? 1 : -1;
      const L = len * between(r, 0.34, 0.52) * (1 - t * 0.3);
      const W = L * between(r, 0.3, 0.42);
      const ang = side * s * between(r, 38, 74) + between(r, -8, 8);
      out.push(`<g transform="translate(${round(bx)} ${round(by)}) rotate(${round(ang)})">`
        + leaf(L, W, between(r, -L * 0.16, L * 0.16)) + `</g>`);
    }
    return out.join("");
  }

  // a small traditional five-petal flower with a dotted centre
  function flower(r, R) {
    const n = 5;
    const spin = between(r, 0, 72);
    let out = "";
    for (let i = 0; i < n; i++) {
      const a = spin + (i / n) * 360 + between(r, -6, 6);
      const p = round(R * between(r, 0.92, 1.08));
      // narrow at the base so the petals read as five separate shapes rather
      // than one lumpy rosette
      const d = `M0 0 C${round(-p * 0.4)} ${round(-p * 0.3)} ${round(-p * 0.62)} ${round(-p * 0.88)} 0 ${round(-p)}`
        + ` C${round(p * 0.62)} ${round(-p * 0.88)} ${round(p * 0.4)} ${round(-p * 0.3)} 0 0 Z`;
      out += `<g transform="rotate(${round(a)})"><path class="petal" d="${d}"/>`
        + `<path class="ink-thin" d="${d}"/></g>`;
    }
    out += `<circle class="eye" cx="0" cy="0" r="${round(R * 0.34)}"/>`;
    return out;
  }

  /* A spiral, for the rolled ends of the scrolls — the detail that makes a
     banner read as a curled ribbon rather than a rectangle with notches. */
  function spiralPath(cx, cy, r0, r1, turns, start, dir) {
    const steps = 44;
    let d = "";
    for (let i = 0; i <= steps; i++) {
      const t = i / steps;
      const [x, y] = polar(cx, cy, start + dir * t * turns * Math.PI * 2, r0 + (r1 - r0) * t);
      d += (i ? " L" : "M") + x + " " + y;
    }
    return d;
  }

  /* The banner: a scroll that sags across its width and rolls up at both
     ends. HW is the half-width of the flat span, before the rolls. */
  function banner(i, text, halfWidth) {
    const HW = halfWidth || 46, T = 19, R = 13;
    // SAG is the one number that sets how much the ribbon bows. Both edges,
    // the shading and the lettering are all derived from it, so the band
    // cannot end up curving by one amount and its text by another.
    const SAG = 8;
    const band = `M${-HW} ${-T / 2} Q0 ${round(-T / 2 - SAG)} ${HW} ${-T / 2}`
      + ` L${HW} ${T / 2} Q0 ${round(T / 2 - SAG)} ${-HW} ${T / 2} Z`;

    let out = `<path class="band" d="${band}"/>`;
    // the underside of the sag catches the shadow
    out += `<path class="band-shade" d="M${-HW} ${T / 2} Q0 ${round(T / 2 - SAG)} ${HW} ${T / 2}`
      + ` L${HW} ${round(T / 2 - 3)} Q0 ${round(T / 2 - SAG - 3)} ${-HW} ${round(T / 2 - 3)} Z"/>`;

    for (const dir of [-1, 1]) {
      const cx = round(dir * (HW + R * 0.72)), cy = round(T * 0.16);
      // the ribbon narrows into the roll
      out += `<path class="band" d="M${dir * HW} ${round(-T / 2)} L${cx} ${cy - R}`
        + ` L${cx} ${cy + R} L${dir * HW} ${round(T / 2)} Z"/>`;
      out += `<circle class="band" cx="${cx}" cy="${cy}" r="${R}"/>`;
      out += `<path class="band-shade" d="M${cx} ${cy + R} A${R} ${R} 0 0 ${dir > 0 ? 1 : 0} `
        + `${round(cx + dir * R * 0.75)} ${round(cy - R * 0.66)} L${cx} ${cy} Z"/>`;
      out += `<circle class="ink" cx="${cx}" cy="${cy}" r="${R}"/>`;
      out += `<path class="ink-thin" d="${spiralPath(cx, cy, R * 0.86, R * 0.2, 1.15, Math.PI * 0.85, dir)}"/>`;
    }

    out += `<path class="ink" d="${band}"/>`;

    /* The lettering rides the band's own CENTRE LINE — which, given both
       edges bow by SAG, is `M-HW 0 Q0 -SAG HW 0`.

       The text stops short of the ends so the letters stay clear of the
       rolls, and that inset is the trap: shortening the span while keeping
       the same control point makes a TIGHTER curve, not the same one. That
       is what had the words arcing half again as hard as the ribbon carrying
       them. So take the true sub-curve of the centre line between the two
       inset points instead of redrawing a shorter quadratic by eye.

       For this curve x(t) = HW(2t - 1), so x reaches -HW+E at t = E/2HW, and
       the sub-curve's own control point follows from the standard quadratic
       subdivision. LIFT is a constant added to every y, so it slides the run
       of text up or down without touching its curvature — it exists because
       `dominant-baseline: middle` sits a shade high in Sancreek. */
    const E = 5, LIFT = 2.2;
    const t0 = E / (2 * HW), t1 = 1 - t0;
    const endY = round(2 * (1 - t0) * t0 * -SAG + LIFT);
    const ctrlY = round(((1 - t0) * t1 + (1 - t1) * t0) * -SAG + LIFT);
    out += `<path id="bnr-${i}" fill="none" d="M${-HW + E} ${endY} Q0 ${ctrlY} ${HW - E} ${endY}"/>`;
    out += `<text class="btext" font-size="13" text-anchor="middle" dominant-baseline="middle">`
      + `<textPath href="#bnr-${i}" startOffset="50%">${esc(text)}</textPath></text>`;
    return out;
  }

  /* The scroll under the name: one banner, a sprig either side and a flower
     tucked into each corner. Foliage is drawn first so only its tips show
     past the ribbon — a scroll floating clear of its leaves reads as two
     drawings that happen to be near each other. */
  function plateSVG(text) {
    const r = rng(hash("plate"));
    let out = "";
    out += `<g transform="translate(-86 14) rotate(-40) scale(1.2)">${sprig(r, 40, 4, true)}</g>`;
    out += `<g transform="translate(86 14) rotate(40) scale(1.2)">${sprig(r, 40, 4, false)}</g>`;
    out += `<g transform="translate(-104 -8) rotate(-14) scale(1.1)">${sprig(r, 30, 3, true)}</g>`;
    out += `<g transform="translate(104 -8) rotate(14) scale(1.1)">${sprig(r, 30, 3, false)}</g>`;
    out += banner(0, text, 74);
    out += `<g transform="translate(-102 16) scale(0.85)">${flower(r, 12)}</g>`;
    out += `<g transform="translate(102 16) scale(0.8)">${flower(r, 11)}</g>`;

    return `<svg class="scroll" viewBox="-124 -40 248 78" preserveAspectRatio="xMidYMid meet"`
      + ` role="img" aria-label="${esc(text)}">${out}</svg>`;
  }

  /* ── age → tier ───────────────────────────────────────────────────
     The whole point of the sheet: the ink records how long ago you
     last touched the work. Sharp is recent. Bled is dormant. */
  const TIERS = [7, 30, 120, 365];

  function tierFor(pushedAt) {
    if (!pushedAt) return 4;
    const days = (Date.now() - Date.parse(pushedAt)) / 86400000;
    if (!isFinite(days)) return 4;
    for (let i = 0; i < TIERS.length; i++) if (days < TIERS[i]) return i;
    return 4;
  }

  function ago(pushedAt) {
    if (!pushedAt) return "unknown";
    const days = Math.max(0, Math.round((Date.now() - Date.parse(pushedAt)) / 86400000));
    if (days < 1) return "today";
    if (days < 2) return "yesterday";
    if (days < 45) return days + " days ago";
    const months = Math.round(days / 30.4);
    if (months < 18) return months + " months ago";
    return Math.round(days / 365) + " years ago";
  }

  const ROMAN = ["i", "ii", "iii", "iv", "v", "vi", "vii", "viii", "ix", "x", "xi", "xii"];

  const clamp = (n, a, b) => Math.min(b, Math.max(a, n));

  /* ── build the sheet ──────────────────────────────────────────────── */
  const data = JSON.parse(document.getElementById("flash-data").textContent);
  const cellsEl = document.getElementById("cells");

  /* `cell` in projects.json used to be a position on a 3x3 grid. There is no
     grid any more, so it survives as a running ORDER: it decides which piece
     is numbered i, and the earlier a piece comes the sooner the packer gets
     to choose its spot — which is to say the better the spot. Nothing needs
     migrating, and no value is invalid. */
  const pieces = (data.pieces || []).slice()
    .sort((a, b) => (a.cell || 99) - (b.cell || 99) || String(a.id).localeCompare(String(b.id)));

  const nodes = new Map();   // item key -> element

  // Resolve every real piece's motif up front so the filler can avoid drawing
  // a shape the work is already using: a stencil sitting a few inches from
  // its own inked twin reads as a duplicate, not as a spare slot.
  const motifOf = new Map(pieces.map((p) => [p.id, resolveMotif(p, rng(hash(p.id)))]));
  const taken = new Set(motifOf.values());
  const unused = MOTIF_NAMES.filter((m) => !taken.has(m));
  const fillerPool = unused.length >= 6 ? unused : MOTIF_NAMES;

  /* ── the filler ───────────────────────────────────────────────────
     Every flash sheet is mostly filler: small traditional pieces packed into
     the gaps so the paper reads as used. These are placeholders in the
     literal sense — they hold space for work that isn't on the sheet yet —
     so they carry no title, no link and no meaning: unlike a project's
     sigil, nothing here is standing for anything.

     None of it is inked — every one is a pencil stencil (see .slot). That is
     what tells you which pieces are real: ink means work, and work opens.

     The fade is seeded from each piece's OWN key rather than drawn from the
     layout's stream, so a re-pack at a different window size can add or drop
     filler without every other piece changing weight.

     The SHAPES are dealt from a shuffled deck rather than picked at random,
     one deck per pass through the vocabulary. Picking each independently is
     what randomness actually looks like — which is to say seven lightning
     bolts and no skull. Dealing guarantees every form appears about as often
     as every other, and reshuffling between passes keeps the repeat from
     landing on a visible period. */
  const DECK = [];
  function motifAt(i) {
    while (DECK.length <= i) {
      const r = rng(hash("deck-" + Math.floor(DECK.length / fillerPool.length)));
      const deck = fillerPool.slice();
      for (let k = deck.length - 1; k > 0; k--) {
        const j = Math.floor(r() * (k + 1));
        [deck[k], deck[j]] = [deck[j], deck[k]];
      }
      DECK.push(...deck);
    }
    return DECK[i];
  }

  const fillerSpec = (key, i) => {
    const r = rng(hash(key));
    return { motif: motifAt(i), fade: round(between(r, 0.3, 0.58)) };
  };

  const SHEET_SEED = hash("flash-sheet-layout");

  /* What wants to go on the paper, biggest first — which is also the order a
     sheet is actually drawn in. Sizes are fractions of u = sqrt(W*H), so the
     NUMBER of pieces needed to fill the sheet is the same at any resolution;
     what changes is physical size, and on a phone twenty-six of these would
     each be a postage stamp. Hence `gain`: fewer pieces, drawn bigger. */
  function buildItems(W, H) {
    const u = Math.sqrt(W * H);
    const gain = u < 620 ? 1.7 : u < 800 ? 1.4 : u < 1000 ? 1.18 : 1;
    // the tiers already account for the bigger pieces `gain` draws — a second
    // reduction on top of them empties the sheet
    const count = gain > 1.6 ? 22 : gain > 1.3 ? 32 : gain > 1.1 ? 42 : 56;
    const r = rng(SHEET_SEED);
    const items = [];

    // The signature scales with everything else, but not past a share of the
    // paper: on a narrow window `gain` would otherwise hand it three quarters
    // of the width and the sheet becomes a headed letter.
    const pw = Math.min(u * 0.36 * gain, W * 0.56, H * 0.62);
    // 0.55 is the name's line plus the scroll's aspect — the box is drawn to
    // its contents so the plate doesn't reserve paper it isn't using
    items.push({ key: "plate", kind: "plate", w: pw, h: pw * 0.55, rot: between(r, -4, 4), home: "top" });

    pieces.forEach((p, i) => {
      const w = u * between(r, 0.185, 0.22) * gain;
      items.push({
        key: p.id, kind: "piece", piece: p, numeral: i,
        w, h: w * 1.16, rot: between(r, -8, 8), home: "inner"
      });
    });

    // A quarter of it is big enough to hold its own next to the work, and the
    // rest steps down to pieces small enough to drop into a corner. A sheet
    // drawn all at one size is a catalogue page.
    for (let i = 0; i < count; i++) {
      const t = i / count;
      const s = (t < 0.25 ? between(r, 0.15, 0.19)
        : t < 0.6 ? between(r, 0.11, 0.145)
        : between(r, 0.075, 0.105)) * gain;
      const w = u * s;
      items.push({
        key: "filler-" + i, kind: "filler", index: i,
        w, h: w, rot: between(r, -18, 18),
        weight: clamp(s / (0.16 * gain), 0.3, 1)
      });
    }

    return items;
  }

  /* ── packing the sheet ────────────────────────────────────────────
     Boxes, not a grid: each piece gets a pile of seeded random candidate
     positions and takes the best one that doesn't touch anything already
     down. "Best" is the interesting part.

     Taking the candidate FURTHEST from its neighbours is ordinary blue
     noise, and it looks it — evenly spaced, which is a grid with the ruler
     rubbed out. Taking the NEAREST packs pieces against each other the way
     filler really does get drawn into gaps, but on its own it grows one dense
     blob and leaves the margins bare.

     So most pieces aim for a TARGET gap instead — close to the nearest thing
     already down, but not touching it — and the rest are explorers that take
     the emptiest spot they can find and start a new cluster somewhere else on
     the paper. Snugglers plus a few explorers fills a sheet evenly without
     ever lining anything up. */
  function packSheet(items, W, H) {
    const r = rng(SHEET_SEED ^ 0x9e3779b9);
    const u = Math.sqrt(W * H);
    const edge = u * 0.008;    // margin of clean paper round the sheet
    const gap = u * 0.011;     // air between two pieces
    const placed = [];
    const out = [];

    const clear = (x, y, w, h) => !placed.some((p) =>
      Math.abs(x - p.x) < (w + p.w) / 2 + gap && Math.abs(y - p.y) < (h + p.h) / 2 + gap);

    const nearest = (x, y) => {
      let d = Infinity;
      for (const p of placed) d = Math.min(d, Math.hypot(x - p.x, y - p.y));
      return d;
    };

    for (const it of items) {
      let w = it.w, h = it.h, spot = null;
      const explorer = r() < 0.22;

      // Five goes, each a little smaller. A tattooer redraws the filler to
      // fit the gap rather than leaving the gap.
      for (let attempt = 0; attempt < 5 && !spot; attempt++) {
        if (attempt) { w *= 0.86; h *= 0.86; }

        // the work sits in from the edges; filler is allowed the margins
        const keep = it.home === "inner" ? 0.08 : 0;
        const x0 = Math.max(edge + w / 2, W * keep), x1 = Math.min(W - edge - w / 2, W * (1 - keep));
        const y0 = Math.max(edge + h / 2, H * keep), y1 = Math.min(H - edge - h / 2, H * (1 - keep));
        if (x1 < x0 || y1 < y0) continue;

        if (it.home === "top") {
          // The signature goes where the signature goes: across the top of the
          // paper, centred, the way a sheet is headed. It is placed before
          // anything else, so the rest of the sheet packs in underneath it.
          spot = {
            x: clamp(W * between(r, 0.44, 0.56), x0, x1),
            y: clamp(y0 + between(r, 0, H * 0.03), y0, y1)
          };
          break;
        }

        // how far from its nearest neighbour's centre this piece would like
        // to sit: its own half-width plus a nudge, i.e. shoulder to shoulder
        const want = w * 0.62 + gap;
        const pool = [];
        let fallback = null, fallbackScore = -Infinity;

        // Collect a SMALL shortlist of workable spots and choose within it,
        // rather than scoring every candidate on the sheet. Scoring all of
        // them makes the preference absolute — a snuggler would then reject
        // open paper every single time, and the sheet fills from wherever the
        // first piece landed outward, leaving whole margins bare. Twelve
        // candidates keeps the preference local: the coverage stays uniformly
        // random, the choice within it stays deliberate.
        for (let k = 0; k < 400 && pool.length < 12; k++) {
          const x = between(r, x0, x1), y = between(r, y0, y1);
          const d = nearest(x, y);
          // remember the roomiest candidate even if it collides — the work
          // must land somewhere, and a piece dropped for want of space is
          // worse than one that crowds a bit of filler
          if (d > fallbackScore) { fallbackScore = d; fallback = { x, y }; }
          if (clear(x, y, w, h)) pool.push({ x, y, d });
        }

        let score = Infinity;
        for (const c of pool) {
          const s = explorer ? -c.d : Math.abs(c.d - want);
          if (s < score) { score = s; spot = { x: c.x, y: c.y }; }
        }

        if (!spot && attempt === 4 && it.kind !== "filler") spot = fallback;
      }

      if (!spot) continue;   // no room: this filler simply isn't drawn
      placed.push({ x: spot.x, y: spot.y, w, h });
      out.push(Object.assign({}, it, { x: spot.x, y: spot.y, w, h }));
    }

    /* Centre the finished composition on the paper. Packing stops when it
       runs out of pieces, not when it runs out of room, so whatever margin is
       left over ends up bunched against one or two edges — an inch of clean
       paper along the bottom and none along the top reads as a sheet that ran
       out, rather than as one that was composed. Splitting the leftover
       evenly costs one pass and cannot introduce an overlap. */
    if (out.length) {
      let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
      for (const o of out) {
        minX = Math.min(minX, o.x - o.w / 2); maxX = Math.max(maxX, o.x + o.w / 2);
        minY = Math.min(minY, o.y - o.h / 2); maxY = Math.max(maxY, o.y + o.h / 2);
      }
      const dx = ((W - maxX) - minX) / 2, dy = ((H - maxY) - minY) / 2;
      for (const o of out) { o.x += dx; o.y += dy; }
    }

    return out;
  }

  /* ── drawing a piece ──────────────────────────────────────────────── */
  function nodeFor(it) {
    const el = document.createElement("div");

    if (it.kind === "plate") {
      /* The plate is PINNED to a tier rather than computed from a date: it is
         identity, not data, so nothing about it should move on its own.

         Pinned to 3, not 0. Tier 0 is fresh linework — thin, crisp, barely
         any bleed — and next to a settled piece of work it read as unfinished
         rather than as restrained. Tier 3 is the look the sheet is after: ink
         that has spread, softened and drifted toward olive, with the
         sub-dermal halo under it. The name is the oldest thing on the paper;
         it should look it. */
      el.className = "cell plate t3";
      el.innerHTML = `<div class="plate-in">`
        + `<h1 class="name tattoo-text">tom gray</h1>`
        + plateSVG(TAGLINE)
        + `</div>`;
    } else if (it.kind === "piece") {
      const p = it.piece;
      el.className = "cell work t" + tierFor(p.github && p.github.pushed_at);
      el.dataset.id = p.id;
      el.innerHTML =
        `<a class="piece" href="#${encodeURIComponent(p.id)}" aria-label="${esc(p.title)}">`
        + `<span class="num">${ROMAN[it.numeral] || it.numeral + 1}</span>`
        + sigil(p.id, motifOf.get(p.id))
        + ribbon(p.title)
        + `</a>`;
    } else {
      const f = fillerSpec(it.key, it.index);
      el.className = "cell filler slot";
      el.style.setProperty("--fade", f.fade);
      el.setAttribute("aria-hidden", "true");
      // weight 0: a stencil hides its wash and stipple, so drawing them is
      // several hundred DOM nodes per sheet that nothing will ever paint
      el.innerHTML = `<div>${sigil(it.key, f.motif, 0)}</div>`;
    }

    return el;
  }

  /* Lay the sheet out against the live viewport. Nodes are kept and reused
     across re-packs — only the box moves. Redrawing them would re-run every
     sigil, and the drawing is the expensive half. */
  function render() {
    const W = innerWidth, H = innerHeight;
    const items = packSheet(buildItems(W, H), W, H);
    const drawn = new Set();

    for (const it of items) {
      let el = nodes.get(it.key);
      if (!el) { el = nodeFor(it); nodes.set(it.key, el); cellsEl.appendChild(el); }
      el.style.display = "";
      el.style.left = round(it.x - it.w / 2) + "px";
      el.style.top = round(it.y - it.h / 2) + "px";
      el.style.width = round(it.w) + "px";
      el.style.height = round(it.h) + "px";
      el.style.setProperty("--u", round(it.w) + "px");
      el.style.setProperty("--rot", round(it.rot) + "deg");
      drawn.add(it.key);
    }

    // a smaller window asks for fewer pieces; whatever it dropped comes off
    // the paper rather than out of the DOM, so it costs nothing to bring back
    for (const [key, el] of nodes) if (!drawn.has(key)) el.style.display = "none";
  }

  render();

  /* Fit the banner's lettering to its scroll. Sancreek is wide, so a fixed
     font-size either overflows the ribbon or under-fills it depending on the
     phrase.

     The measurement has to happen on a DETACHED text element, not on the
     textPath itself: text that overruns its path is clipped at both ends,
     and the clipped element then reports a length that already fits — so
     asking it whether it overflows always answers no, and the first and
     last letters silently disappear.

     Runs after fonts.ready; measuring before the webfont lands gives
     fallback metrics and the wrong answer. */
  function fitBanners() {
    const svg = document.querySelector(".scroll");
    if (!svg) return;
    const NS = "http://www.w3.org/2000/svg";
    const probe = document.createElementNS(NS, "text");
    probe.setAttribute("class", "btext");
    probe.setAttribute("x", "-9999");
    probe.setAttribute("y", "-9999");
    svg.appendChild(probe);

    // Two passes, so every banner on the sheet ends up at ONE size, set by
    // the tightest phrase. Fitting each to its own ribbon independently is
    // what a layout engine would do, but it makes the lettering step between
    // banners on a single piece — which no tattooer would do.
    const texts = [...svg.querySelectorAll(".btext")];
    let ratio = 1;

    for (const t of texts) {
      const tp = t.querySelector("textPath");
      if (!tp) continue;
      const room = svg.querySelector(tp.getAttribute("href")).getTotalLength() * 0.94;
      const size = parseFloat(t.getAttribute("font-size"));
      probe.setAttribute("font-size", String(size));
      probe.textContent = tp.textContent;
      ratio = Math.min(ratio, room / probe.getComputedTextLength());
    }

    if (ratio < 1) {
      for (const t of texts) {
        t.setAttribute("font-size", round(parseFloat(t.getAttribute("font-size")) * ratio));
      }
    }

    probe.remove();
  }
  /* The project ribbons need the same treatment for a different reason. The
     banner lettering is SVG, so it scales with the viewBox for free; the
     ribbon title is HTML text at a viewport-derived size sitting in a ribbon
     whose width is a percentage. Those two scale on different curves, so a
     long title spills past the ribbon ends on narrow screens — which is how
     "smart blinds" became "MART BLIND". Unlike the banners this has to
     re-run on resize, because the available width is in px, not user units. */
  function fitRibbons() {
    document.querySelectorAll(".ribbon-text").forEach((box) => {
      const label = box.querySelector(".rt");
      if (!label) return;
      // The size goes on the BOX, not on the inner label. `letter-spacing`
      // is declared in em on .ribbon-text, so it computes there once and
      // inherits downward as a fixed PX length. Shrinking the label alone
      // therefore shrinks the glyphs but not the ~12px of tracking between
      // them: the width stops scaling linearly with font-size, and the
      // fitter converges on a size it wrongly believes fits. Sizing the box
      // makes the tracking re-resolve and the whole run scale together.
      box.style.fontSize = "";
      const cs = getComputedStyle(box);
      const room = box.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
      if (room <= 0) return;
      let size = parseFloat(cs.fontSize);
      // percentage padding resolves against the containing block, not the
      // font, so `room` is stable across passes and this cannot oscillate
      for (let pass = 0; pass < 3; pass++) {
        const w = label.getBoundingClientRect().width;
        if (w <= room) break;
        size = size * (room * 0.97 / w);
        box.style.fontSize = size.toFixed(2) + "px";
      }
    });
  }

  function fitAll() { fitBanners(); fitRibbons(); }

  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitAll);
  else addEventListener("load", fitAll);

  /* Refit whenever a ribbon's box actually changes size, not just on window
     resize. fonts.ready fires before the sheet has finished settling — the
     scroll SVG resolves its height, the plate reflows, and a ribbon box can
     end up a few px narrower AFTER the fitter has already run against the old
     width. That left the title one pixel over its ribbon at narrow widths.
     Observing the box closes the loop; changing the label's font-size does
     not change the wrapper's width (it is a percentage of the cell), so this
     cannot feed back on itself. */
  if (window.ResizeObserver) {
    let roTimer = 0;
    const ro = new ResizeObserver(() => {
      clearTimeout(roTimer);
      roTimer = setTimeout(fitRibbons, 60);
    });
    document.querySelectorAll(".ribbon-wrap").forEach((el) => ro.observe(el));
  }

  /* A resize re-packs the whole sheet rather than stretching it: the boxes
     are px, and the composition is a function of the paper's shape. Same
     seed, so it is recognisably the same sheet, redrawn to fit. */
  let fitTimer = 0;
  addEventListener("resize", () => {
    clearTimeout(fitTimer);
    fitTimer = setTimeout(() => {
      render();
      fitRibbons();
      // a zoomed piece is positioned from measured geometry, so it has to be
      // recomputed against the new layout or the zoom drifts off its piece
      if (current) zoomTo(current);
    }, 120);
  });

  /* ── zoom: navigate the plane by depth, not by length ─────────────
     One transform on one element, so it animates natively in every
     browser — no framework, and deliberately NOT the View Transitions
     API: VT cross-fades a snapshot of the old page against the new one,
     which would replace this real transform with a dissolve. A genuine
     scale reads as leaning into the sheet; a dissolve reads as a slide
     deck. The reader chrome fades in over it via CSS. */
  const sheet = document.getElementById("sheet");
  const reader = document.getElementById("reader");
  const dismiss = document.getElementById("dismiss");

  /* There is no single zoom factor any more, because the pieces are no longer
     one size: the packer draws each one somewhere between a stamp and a palm.
     So the scale is computed per piece, from its measured box rather than from
     anything the layout was asked for (the packer shrinks pieces that wouldn't
     otherwise fit), to fill a target box on screen.

     The piece is NOT centred: it goes top-right and the reader takes the
     bottom-left, so the two never sit on top of each other. Below 760px there
     isn't room to put them side by side, so the piece goes to the top and the
     reader keeps the bottom. */
  function zoomTo(id) {
    const el = nodes.get(id);
    if (!el) { sheet.style.transform = "translate(0, 0) scale(1)"; return; }

    const w = el.offsetWidth, h = el.offsetHeight;
    const narrow = innerWidth < 760;
    const boxW = innerWidth * (narrow ? 0.78 : 0.48);
    const boxH = innerHeight * (narrow ? 0.34 : 0.66);
    const z = clamp(Math.min(boxW / w, boxH / h), 1.3, 4.4);

    // where that box wants the piece's centre to end up on screen
    const toX = narrow ? innerWidth / 2 : innerWidth * 0.96 - boxW / 2;
    const toY = innerHeight * 0.05 + boxH / 2;

    const cx = el.offsetLeft + w / 2, cy = el.offsetTop + h / 2;
    // the zoomed glow divides its radii by this, so it has to be readable
    // from CSS rather than baked into the transform string
    document.body.style.setProperty("--z", round(z));
    sheet.style.transform =
      `translate(${round(toX - z * cx)}px, ${round(toY - z * cy)}px) scale(${round(z)})`;
  }

  /* Every flash sheet quotes a price against every piece on it. This is that
     line: whether the work can be taken, or was paid for, or is nobody's but
     his. Written in the sheet's own register rather than as a licence badge. */
  const TERMS = {
    open:    ["free to take", "open source — copy it, run it, change it"],
    profit:  ["commissioned", "for profit — the work is sold, not given"],
    private: ["not for sale", "private work — you can see it, you can't have it"]
  };

  function readerHTML(p) {
    const g = p.github || {};
    const meta = [];
    if (g.language) meta.push(["written in", g.language]);
    meta.push(["last worked", ago(g.pushed_at)]);
    if (g.stars) meta.push(["stars", String(g.stars)]);

    const terms = TERMS[p.terms] || (p.url ? TERMS.open : TERMS.private);
    const build = Array.isArray(p.build) ? p.build : (p.build ? [p.build] : []);

    // The title stays in the DOM but not on the screen: it is already lettered
    // on the piece's own ribbon, two feet high, right next to this panel — but
    // the panel is an aria-live region, and announcing a body of text with no
    // idea what it is about is worse than a redundant heading.
    return `<h2 class="unseen">${esc(p.title)}</h2>`
      + (p.banner ? `<p class="lede">${esc(p.banner)}</p>` : "")
      + (p.problem
        ? `<section><h3>what it's for</h3><p>${esc(p.problem)}</p></section>` : "")
      + (build.length
        ? `<section><h3>how it's built</h3><ul>`
          + build.map((line) => `<li>${esc(line)}</li>`).join("")
          + `</ul></section>` : "")
      + `<dl>${meta.map(([k, v]) => `<div><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join("")}</dl>`
      + `<p class="terms"><span class="stamp">${esc(terms[0])}</span>${esc(terms[1])}</p>`
      // Off-site links open in a new tab: the sheet holds no scroll position
      // and no history worth losing, but it does hold a zoom state you would
      // have to find your way back into. `noopener` is not optional with
      // `_blank` — without it the opened page gets a handle on this one.
      + (p.url
        ? `<a class="out" href="${esc(p.url)}" target="_blank" rel="noopener">`
          + `see the work &rarr;<span class="unseen"> (opens in a new tab)</span></a>`
        : `<span class="locked">nothing to claim</span>`);
  }

  let current = null;

  function apply(id) {
    const p = id ? pieces.find((x) => x.id === id) : null;

    for (const [, node] of nodes) node.classList.remove("active");

    if (!p) {
      document.body.classList.remove("zoomed");
      sheet.style.transform = "translate(0, 0) scale(1)";
      document.body.style.setProperty("--z", "1");
      reader.innerHTML = "";
      current = null;
      return;
    }

    const cell = nodes.get(p.id);
    if (cell) cell.classList.add("active");
    // the reader inherits the piece's tier, so its title bleeds by the
    // same amount the flash does
    reader.className = "reader t" + tierFor(p.github && p.github.pushed_at);
    reader.innerHTML = readerHTML(p);
    document.body.classList.add("zoomed");
    zoomTo(p.id);
    current = p.id;
    if (id !== null) reader.focus({ preventScroll: true });
  }

  function route() {
    const id = decodeURIComponent(location.hash.replace(/^#/, ""));
    const valid = id && pieces.some((p) => p.id === id);
    const next = valid ? id : null;
    if (next === current) return;

    apply(next);

    // tidy the trailing "#" the close leaves behind
    if (!valid && location.hash) {
      history.replaceState(null, "", location.pathname + location.search);
    }
  }

  addEventListener("hashchange", route);
  route();

  const close = () => { location.hash = ""; };
  dismiss.addEventListener("click", close);
  addEventListener("keydown", (e) => {
    if (e.key === "Escape" && current) { e.preventDefault(); close(); }
  });

})();
</script>
</body>
</html>
