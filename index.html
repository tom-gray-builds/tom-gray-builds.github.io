<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>tom gray</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@300;400&family=IM+Fell+English:ital@0;1&display=swap"
  rel="stylesheet"
/>
<style>
  :root {
    --ink: #20222f;
    --line: rgba(20, 20, 25, 0.28);
    --paper: #f4f1ea;

    /* ===== Tattoo styling =====
       The blown-out, old-tattoo ink look. Shared by the centre name and
       the grid lines so they read as the same hand.
       - --tattoo-filter: SVG edge roughen + spread, slight blur, desaturate
       - --tattoo-glow:   stacked drop-shadows = ink bleed + a blue-green
                          sub-dermal halo (works on any filled shape)
       Text elements additionally use text-shadow / -webkit-text-stroke
       (below, on .name) for crisper per-glyph glow. */
    --tattoo-filter: url(#blowout) blur(0.6px) saturate(0.8);
    --tattoo-glow:
      drop-shadow(0 0 1px rgba(32, 34, 47, 0.9))
      drop-shadow(0 0 4px rgba(58, 74, 90, 0.5))
      drop-shadow(0 0 12px rgba(58, 74, 90, 0.25))
      drop-shadow(1px 1px 0 rgba(58, 74, 90, 0.32))
      drop-shadow(0 0 6px rgba(60, 90, 100, 0.35));
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html,
  body {
    height: 100%;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background-color: var(--paper);
  }

  /* 3 x 3 grid: only the two interior lines on each axis, no edges */
  .grid {
    position: fixed;
    inset: 0;
    z-index: 0;
    --w: 4px;
    --h: calc(var(--w) / 2);
    background-image:
      linear-gradient(
        to right,
        transparent calc(100% / 3 - var(--h)),
        var(--line) calc(100% / 3 - var(--h)) calc(100% / 3 + var(--h)),
        transparent calc(100% / 3 + var(--h)) calc(200% / 3 - var(--h)),
        var(--line) calc(200% / 3 - var(--h)) calc(200% / 3 + var(--h)),
        transparent calc(200% / 3 + var(--h))
      ),
      linear-gradient(
        to bottom,
        transparent calc(100% / 3 - var(--h)),
        var(--line) calc(100% / 3 - var(--h)) calc(100% / 3 + var(--h)),
        transparent calc(100% / 3 + var(--h)) calc(200% / 3 - var(--h)),
        var(--line) calc(200% / 3 - var(--h)) calc(200% / 3 + var(--h)),
        transparent calc(200% / 3 + var(--h))
      );
    /* tattoo styling — identical to the centre name */
    filter: var(--tattoo-filter) var(--tattoo-glow);
  }

  /* text form of the tattoo styling: SVG blowout + ink-bleed glow + stroke */
  .tattoo-text {
    filter: var(--tattoo-filter);
    text-shadow:
      0 0 1px rgba(32, 34, 47, 0.9),
      0 0 4px rgba(58, 74, 90, 0.55),
      0 0 12px rgba(58, 74, 90, 0.28),
      1px 1px 0 rgba(58, 74, 90, 0.35),
      -1px 0 0 rgba(58, 74, 90, 0.3);
    -webkit-text-stroke: 0.4px rgba(32, 34, 47, 0.35);
  }

  /* name + subtitle, stacked in the middle cell of the 3x3 grid */
  .plate {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(0.9rem, 3vw, 2rem);
    user-select: none;
  }

  .name {
    position: relative;
    /* lighter blackletter — thinner strokes so the ink blowout stays crisp */
    font-family: "Grenze Gotisch", "IM Fell English", serif;
    font-weight: 300;
    /* stays within the middle cell (~1/3 of the viewport) */
    font-size: clamp(1.9rem, 7vw, 6.5rem);
    line-height: 1;
    color: var(--ink);
    letter-spacing: 0.03em;
    text-transform: lowercase;
    white-space: nowrap;
  }

  .name::before {
    content: "tom gray";
    position: absolute;
    inset: 0;
    color: rgba(60, 90, 100, 0.35);
    filter: blur(4px);
    z-index: -1;
  }

  .tagline {
    font-family: "IM Fell English", "Pirata One", serif;
    font-style: italic;
    font-size: clamp(0.72rem, 1.9vw, 1.3rem);
    line-height: 1;
    letter-spacing: 0.14em;
    color: var(--ink);
    white-space: nowrap;
  }

  .tagline .sep {
    opacity: 0.55;
    padding: 0 0.3em;
    font-style: normal;
  }
</style>
</head>
<body>
  <div class="grid"></div>

  <div class="plate">
    <h1 class="name tattoo-text">tom gray</h1>
    <p class="tagline tattoo-text">
      Growth hacker<span class="sep">//</span>AI explorer
    </p>
  </div>

  <svg width="0" height="0" style="position: absolute">
    <!-- roughen + spread the letter edges like ink bled under skin -->
    <filter id="blowout">
      <feTurbulence
        type="fractalNoise"
        baseFrequency="0.012 0.018"
        numOctaves="2"
        seed="7"
        result="noise"
      />
      <feDisplacementMap
        in="SourceGraphic"
        in2="noise"
        scale="6"
        xChannelSelector="R"
        yChannelSelector="G"
        result="displaced"
      />
      <feGaussianBlur in="displaced" stdDeviation="0.5" result="soft" />
      <feMorphology in="soft" operator="dilate" radius="0.4" result="spread" />
      <feMerge>
        <feMergeNode in="spread" />
        <feMergeNode in="soft" />
      </feMerge>
    </filter>
  </svg>
</body>
</html>
