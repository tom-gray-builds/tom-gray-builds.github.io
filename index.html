<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>tom gray</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Pirata+One&family=IM+Fell+English:ital@0;1&display=swap"
  rel="stylesheet"
/>
<style>
  :root {
    --ink: #20222f;
    --line: rgba(20, 20, 25, 0.28);
    --paper: #f4f1ea;

    /* ===== Tattoo styling =====
       The blown-out, old-tattoo ink look. Shared by the centre name and
       the grid lines so they read as the same hand.
       - --tattoo-filter: SVG edge roughen + spread, slight blur, desaturate
       - --tattoo-glow:   stacked drop-shadows = ink bleed + a blue-green
                          sub-dermal halo (works on any filled shape)
       Text elements additionally use text-shadow / -webkit-text-stroke
       (below, on .name) for crisper per-glyph glow. */
    --tattoo-filter: url(#blowout) blur(0.6px) saturate(0.8);
    --tattoo-glow:
      drop-shadow(0 0 1px rgba(32, 34, 47, 0.9))
      drop-shadow(0 0 4px rgba(58, 74, 90, 0.5))
      drop-shadow(0 0 12px rgba(58, 74, 90, 0.25))
      drop-shadow(1px 1px 0 rgba(58, 74, 90, 0.32))
      drop-shadow(0 0 6px rgba(60, 90, 100, 0.35));
  }

  /* Below ~600px the name renders near its 1.75rem clamp floor. The
     tattoo filter's blur/displacement/stroke widths above are tuned in
     fixed px for the ~96px desktop size, so at that floor they're large
     relative to the glyph strokes and the blackletter letterforms blur
     into each other ("squashed"). Swap in a lighter SVG filter and
     thinner glow so the distortion stays proportional to letter size. */
  @media (max-width: 600px) {
    :root {
      --tattoo-filter: url(#blowout-mobile) blur(0.3px) saturate(0.8);
      --tattoo-glow:
        drop-shadow(0 0 0.5px rgba(32, 34, 47, 0.9))
        drop-shadow(0 0 2px rgba(58, 74, 90, 0.5))
        drop-shadow(0 0 6px rgba(58, 74, 90, 0.25))
        drop-shadow(0.5px 0.5px 0 rgba(58, 74, 90, 0.32))
        drop-shadow(0 0 3px rgba(60, 90, 100, 0.35));
    }
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html,
  body {
    height: 100%;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background-color: var(--paper);
  }

  /* 3 x 3 grid: only the two interior lines on each axis, no edges */
  .grid {
    position: fixed;
    inset: 0;
    z-index: 0;
    --w: 4px;
    --h: calc(var(--w) / 2);
    background-image:
      linear-gradient(
        to right,
        transparent calc(100% / 3 - var(--h)),
        var(--line) calc(100% / 3 - var(--h)) calc(100% / 3 + var(--h)),
        transparent calc(100% / 3 + var(--h)) calc(200% / 3 - var(--h)),
        var(--line) calc(200% / 3 - var(--h)) calc(200% / 3 + var(--h)),
        transparent calc(200% / 3 + var(--h))
      ),
      linear-gradient(
        to bottom,
        transparent calc(100% / 3 - var(--h)),
        var(--line) calc(100% / 3 - var(--h)) calc(100% / 3 + var(--h)),
        transparent calc(100% / 3 + var(--h)) calc(200% / 3 - var(--h)),
        var(--line) calc(200% / 3 - var(--h)) calc(200% / 3 + var(--h)),
        transparent calc(200% / 3 + var(--h))
      );
    /* tattoo styling — identical to the centre name */
    filter: var(--tattoo-filter) var(--tattoo-glow);
  }

  .name {
    position: relative;
    z-index: 1;
    font-family: "Pirata One", "IM Fell English", serif;
    /* stays within the middle cell of the 3x3 grid (~1/3 of the viewport) */
    font-size: clamp(1.75rem, 6.5vw, 6rem);
    line-height: 1;
    color: var(--ink);
    letter-spacing: 0.03em;
    text-transform: lowercase;
    white-space: nowrap;
    user-select: none;
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;

    /* tattoo styling */
    filter: var(--tattoo-filter);
    text-shadow:
      0 0 1px rgba(32, 34, 47, 0.9),
      0 0 4px rgba(58, 74, 90, 0.55),
      0 0 12px rgba(58, 74, 90, 0.28),
      1px 1px 0 rgba(58, 74, 90, 0.35),
      -1px 0 0 rgba(58, 74, 90, 0.3);
    -webkit-text-stroke: 0.4px rgba(32, 34, 47, 0.35);
  }

  .name::before {
    content: "tom gray";
    position: absolute;
    inset: 0;
    color: rgba(60, 90, 100, 0.35);
    filter: blur(4px);
    z-index: -1;
  }

  @media (max-width: 600px) {
    .name {
      text-shadow:
        0 0 0.5px rgba(32, 34, 47, 0.9),
        0 0 2px rgba(58, 74, 90, 0.55),
        0 0 6px rgba(58, 74, 90, 0.28),
        0.5px 0.5px 0 rgba(58, 74, 90, 0.35),
        -0.5px 0 0 rgba(58, 74, 90, 0.3);
      -webkit-text-stroke: 0.2px rgba(32, 34, 47, 0.35);
    }

    .name::before {
      filter: blur(2px);
    }
  }
</style>
</head>
<body>
  <div class="grid"></div>
  <h1 class="name">tom gray</h1>

  <svg width="0" height="0" style="position: absolute">
    <!-- roughen + spread the letter edges like ink bled under skin -->
    <filter id="blowout">
      <feTurbulence
        type="fractalNoise"
        baseFrequency="0.012 0.018"
        numOctaves="2"
        seed="7"
        result="noise"
      />
      <feDisplacementMap
        in="SourceGraphic"
        in2="noise"
        scale="6"
        xChannelSelector="R"
        yChannelSelector="G"
        result="displaced"
      />
      <feGaussianBlur in="displaced" stdDeviation="0.5" result="soft" />
      <feMorphology in="soft" operator="dilate" radius="0.4" result="spread" />
      <feMerge>
        <feMergeNode in="spread" />
        <feMergeNode in="soft" />
      </feMerge>
    </filter>

    <!-- lighter version of #blowout for the small mobile clamp floor, so
         the ink-bleed distortion stays proportional to the smaller glyphs
         instead of swallowing them -->
    <filter id="blowout-mobile">
      <feTurbulence
        type="fractalNoise"
        baseFrequency="0.012 0.018"
        numOctaves="2"
        seed="7"
        result="noise"
      />
      <feDisplacementMap
        in="SourceGraphic"
        in2="noise"
        scale="2.5"
        xChannelSelector="R"
        yChannelSelector="G"
        result="displaced"
      />
      <feGaussianBlur in="displaced" stdDeviation="0.25" result="soft" />
      <feMorphology in="soft" operator="dilate" radius="0.2" result="spread" />
      <feMerge>
        <feMergeNode in="spread" />
        <feMergeNode in="soft" />
      </feMerge>
    </filter>
  </svg>
</body>
</html>
